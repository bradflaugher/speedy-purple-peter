name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GBDK_VERSION: "4.3.0"

jobs:
  test:
    name: Build ROM + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GBDK-2020
        run: |
          curl -fsSL -o /tmp/gbdk.tar.gz \
            "https://github.com/gbdk-2020/gbdk-2020/releases/download/${GBDK_VERSION}/gbdk-linux64.tar.gz"
          sudo tar -xzf /tmp/gbdk.tar.gz -C /opt
          /opt/gbdk/bin/lcc -v || true

      - name: Install PyBoy (headless Game Boy emulator for the ROM tests)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyboy pillow numpy
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Host tests (physics, generator, mechanics, search bot, sound engine)
        run: make test-host

      - name: Asset pipeline tests (and the generated files are up to date)
        run: |
          make test-assets
          python3 tools/gen_assets.py --check

      - name: Build ROM
        run: make rom

      - name: ROM tests (DMG + CGB; the ROM must play exactly like the host simulation)
        run: make test-rom

      - name: Balance report (the bot plays 12 sectors)
        run: build/sppgen bot 1 12

      - name: Upload ROM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speedy-purple-peter-${{ github.sha }}
          path: |
            build/speedy-purple-peter.gb
            build/speedy-purple-peter.sym
            build/screens/*.png

  release:
    name: Release (date-stamped, latest only)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: speedy-purple-peter-${{ github.sha }}
          path: dist

      - name: Publish release and prune all older ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(date -u +%Y.%m.%d)"
          ROM="dist/speedy-purple-peter-${TAG}.gb"
          cp dist/speedy-purple-peter.gb "$ROM"

          # Only the latest release is kept: delete every existing release and its tag
          # (including an earlier one from today, which this build replaces).
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r old; do
            echo "Deleting release $old"
            gh release delete "$old" --yes --cleanup-tag
          done
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true

          cat > notes.md <<NOTES
          **SPEEDY PURPLE PETER** build ${TAG} (commit ${GITHUB_SHA::7}).

          Load \`speedy-purple-peter-${TAG}.gb\` in any Game Boy emulator, or copy it to a flash cart
          (EverDrive, etc.). Runs on DMG, Pocket, Color and GBC-compatible handhelds (colour and a
          locked 60 fps on Color hardware).
          NOTES

          gh release create "$TAG" "$ROM" dist/speedy-purple-peter.sym \
            --target "$GITHUB_SHA" \
            --title "Speedy Purple Peter ${TAG}" \
            --notes-file notes.md \
            --latest
